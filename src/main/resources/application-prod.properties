# ============================================================
#  application-prod.properties — Perfil de producción (Railway)
# ============================================================

# Puerto dinámico inyectado por Railway (fallback 3001)
server.port=${PORT:3001}

# MongoDB — URI provista por Railway al agregar el plugin
spring.data.mongodb.uri=${MONGODB_URI}

# Desactivar auto-index creation en prod (mejor rendimiento)
spring.data.mongodb.auto-index-creation=false

# Mail SMTP — variables de entorno definidas en Railway
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging reducido en producción
logging.level.root=WARN
logging.level.ar.edu.unq=INFO
