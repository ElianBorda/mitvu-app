server.port=${PORT:3001}

# MongoDB ? sobreescribe el localhost del application.properties
spring.data.mongodb.uri=${MONGODB_URI}
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

# Mail SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ?? Actuator ????????????????????????????????????????????????
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Deshabilitar health indicators problemáticos
# RabbitMQ no existe en este entorno ? lo excluimos
management.health.rabbit.enabled=false
# Precaución extra: si Mongo sigue fallando al arrancar, descomentar:
# management.health.mongo.enabled=false

# Logging
logging.level.root=WARN
logging.level.ar.edu.unq=INFO