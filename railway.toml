# ============================================================
#  railway.toml — Configuración del servicio Backend en Railway
# ============================================================

[build]
# Usar Dockerfile explícito (más control que Nixpacks)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Comando de healthcheck para que Railway sepa que el servicio levantó
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
